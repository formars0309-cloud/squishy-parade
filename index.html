<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>슬라임 라인</title>
    <meta name="theme-color" content="#c9c2f2" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/slime-192.png" />
    <script>
      // 카카오톡 안 브라우저는 주소창·아래 줄을 숨길 수 없어 기본 브라우저로 옮긴다. 여기서는 표시만 하고, 옮기기와 버튼은 안내 화면을
      // 그린 뒤 body 끝에서 한다. 남은 창은 src/game/webShell.ts의 kakaoGate()가 게임 시작을 막는다(기획서 「웹 전체 화면과 카카오톡 링크」)
      (function () {
        if (!/KAKAOTALK/i.test(navigator.userAgent)) return;
        if (/[?&]kakao=stay(&|$)/.test(location.search)) return;
        try { if (sessionStorage.getItem('slime-kakao-stay') === '1') return; } catch (e) {}
        window.__slimeKakaoHold = true;
        document.documentElement.classList.add('kakao-out');
      })();
    </script>
    <link rel="icon" href="data:," />
    <link rel="preload" href="fonts/Jua-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/SingleDay-title.woff2" as="font" type="font/woff2" crossorigin />
    <style>@font-face{font-family:Jua;src:url(fonts/Jua-Regular.woff2)format("woff2");font-display:block}@font-face{font-family:SingleDayTitle;src:url(fonts/SingleDay-title.woff2)format("woff2");font-display:block}html,body{background:#c9c2f2;height:100%;margin:0;padding:0;overflow:hidden}#game{inset:var(--safe-area-inset-top,env(safe-area-inset-top,0px)) var(--safe-area-inset-right,env(safe-area-inset-right,0px)) var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) var(--safe-area-inset-left,env(safe-area-inset-left,0px));position:fixed}#game canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{overscroll-behavior:none;touch-action:none}#rotate-hint{display:none}@media (width<=700px) and (orientation:portrait){#rotate-hint{z-index:10;box-sizing:border-box;color:#fff8ea;text-align:center;background:#b9aef3;justify-content:center;align-items:center;padding:28px;font:24px/1.5 Jua,sans-serif;display:flex;position:fixed;inset:0}}#kakao-hint,.kakao-out #rotate-hint{display:none}.kakao-out #kakao-hint{z-index:20;box-sizing:border-box;color:#fff8ea;text-align:center;background:#b9aef3;flex-direction:column;justify-content:center;align-items:center;gap:28px;padding:28px;font:24px/1.5 Jua,sans-serif;display:flex;position:fixed;inset:0}#kakao-hint p{margin:0}#kakao-hint div{flex-wrap:wrap;justify-content:center;gap:14px;display:flex}#kakao-hint button{color:#7a5a8a;background:#fff8ea;border:0;border-radius:18px;padding:12px 22px;font:20px Jua,sans-serif;box-shadow:0 4px #8f80d6}#kakao-hint #kakao-stay{color:#fff8ea;background:0 0;box-shadow:inset 0 0 0 2px #fff8ea}</style>
    <script type="module" crossorigin src="./assets/index-C-iqjvaI.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/quality-C0zgIwfP.js">
    <link rel="modulepreload" crossorigin href="./assets/dist-CD5Q11Pt.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CY3pBzyE.css">
  </head>
  <body>
    <div id="game"></div>
    <div id="kakao-hint">
      <p id="kakao-hint-text">기본 브라우저에서 열었어요<br />그쪽에서 화면 가득 놀 수 있어요</p>
      <div><button id="kakao-reopen" type="button">브라우저로 다시 열기</button><button id="kakao-stay" type="button">카카오톡에서 계속하기</button></div>
    </div>
    <div id="rotate-hint">휴대폰을 가로로 돌려<br />손으로 길을 그려 주세요</div>
    <script>
      // 버튼은 게임 코드 없이 움직인다(옮기는 중에 게임 코드가 멈춰 있어도 아이가 갇히지 않게).
      // 계속하기는 이 창에 표시를 남기고 kakao=stay를 붙여 다시 읽는다(창 저장소가 막혀도 주소로 안다)
      (function () {
        if (!window.__slimeKakaoHold) return;
        var open = function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); };
        document.getElementById('kakao-reopen').onclick = open;
        document.getElementById('kakao-stay').onclick = function () {
          try { sessionStorage.setItem('slime-kakao-stay', '1'); } catch (e) {}
          location.replace(location.href + (location.search ? '&' : '?') + 'kakao=stay');
        };
        open();
      })();
    </script>
  </body>
</html>
